name: Deploy OnWordsAndUpWords

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build

      - name: Build Python wheel
        run: python -m build --wheel

      - name: Assemble website
        run: |
          mkdir -p _site/js _site/dist
          cp index.html _site/
          cp -R js/. _site/js/

          if [ -d css ]; then
            cp -R css _site/css
          fi

          if [ -d assets ]; then
            cp -R assets _site/assets
          fi

      - name: Prepare wheel and manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))

          if len(wheels) != 1:
              raise RuntimeError(
                  f"Expected exactly one wheel, found {len(wheels)}"
              )

          wheel = wheels[0]
          commit = os.environ["COMMIT_SHA"]

          destination = Path("_site/dist") / commit
          destination.mkdir(parents=True, exist_ok=True)

          shutil.copy2(wheel, destination / wheel.name)

          manifest = {
              "wheel": f"{commit}/{wheel.name}"
          }

          Path("_site/dist/manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5